[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gas-export"
version = "0.1.0"
readme = "README.ja.md"
license = "MIT"
license-files = ["LICENSE"]
description = "Discover bound Apps Script project IDs under Drive folders and export project sources"
requires-python = ">=3.10"
dependencies = [
  "google-api-python-client>=2.0",
  "google-auth-oauthlib>=1.0",
  "playwright>=1.40",
]

[project.scripts]
gas-export = "gas_export.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
